# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      # Ruff lint checks with auto-fix enabled
      - id: ruff-check
        args: [ --fix ]
        language: python
        types_or: [python, pyi]
      # Ruff will also run formatting
      - id: ruff-format
        language: python
        types_or: [python, pyi]

  # Local hook for running "ty" type checking
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uvx ty check .
        language: system
        types: [python]
        pass_filenames: false
        # Always run on all Python files
        always_run: true
